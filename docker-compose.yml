services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - library-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8082:8080"
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - library-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development # le conteneur lance automatiquement ng serve
      #target : production # il continue jusqu'à l'étape production -> nginx
    restart: unless-stopped

    # live reload
    ports:
      - "4200:4200"                                         # Angular dev server 
    volumes:
      - ./frontend:/app                            # pr que le fichier qu'on modif soit immédiatement visible dans le conteneur
      - /app/node_modules                                   # node_modules dans le conteneur pr éviter les conflits

    #  mode prod : 

    # ports:
    #   - "4200:80"                                         # Nginx sert les fichiers statique 
    depends_on: 
      - backend
    networks: 
      - library-network

volumes:
  postgres-data:

networks:
  library-network:
    driver: bridge
