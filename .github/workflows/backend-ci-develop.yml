name: Backend CI - Develop   

on:
  pull_request:
    branches: [ develop ]           # Se déclenche à chaque PR sur develop
    paths:
      - 'backend/**'               # …ou dès qu’un fichier du répertoire backend change
      - 'pom.xml'                  # …ou si le pom.xml est modifié

jobs:
  backend-ci:
    name:  Backend Tests          
    runs-on: ubuntu-latest         # Machine Ubuntu fournie par GitHub

    steps:
      # Récupérer le code source du dépôt (git clone)
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      # Installer Java 21 (distribution Temurin) + activer le cache Maven
      - name: ☕ Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # Compiler le projet et lancer les tests unitaires
      - name:  Compile & Test
        run: |
          cd backend                
          ./mvnw clean compile test 